<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Video del equipo</title>
  <style>
    :root{
      --bg:#0b111c;
      --card:#111a29;
      --line:#263449;
      --text:#f7f9fc;
      --muted:#b9c7dc;
      --accent:#3b82f6;
      --accent2:#2563eb;
      --danger:#fca5a5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{padding:32px 18px 48px}
    .wrap{width:min(1100px,100%);margin:0 auto}
    .hero{text-align:center;padding:34px 0 18px}
    h1{margin:0 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.08}
    .sub{margin:0;color:var(--muted);font-size:clamp(14px,2vw,17px)}
    .model{margin-top:10px;font-weight:800;color:#dbeafe;word-break:break-word}
    .grid{display:grid;gap:18px;margin-top:16px}
    .video-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card)}
    .video-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
    .video-head strong{font-size:15px}
    .frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
    .frame-wrap:fullscreen,.frame-wrap:-webkit-full-screen{width:100%;height:100%;aspect-ratio:auto;background:#000}
    .frame-wrap:fullscreen iframe,.frame-wrap:-webkit-full-screen iframe{width:100%;height:100%}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    .play-cover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:0;background:radial-gradient(circle at center,rgba(35,75,135,.30),rgba(0,0,0,.88));color:#fff;cursor:pointer;padding:24px;text-align:center}
    .play-cover.hidden{display:none}
    .play-icon{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;padding-left:7px;font-size:46px;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 18px 50px rgba(37,99,235,.42)}
    .play-cover strong{font-size:clamp(20px,4vw,30px)}
    .play-cover span{max-width:560px;color:#d7e3f5;font-size:14px;line-height:1.5}
    .fullscreen-fallback{position:fixed!important;inset:0!important;z-index:999999!important;width:100vw!important;height:100vh!important;aspect-ratio:auto!important;border-radius:0!important}
    .error{display:none;margin-top:16px;padding:20px;border:1px solid #5a2c35;border-radius:16px;background:#24131a;color:var(--danger);text-align:center}
    .error h2{margin:0 0 8px;color:#fff}
    @media(max-width:640px){body{padding:20px 12px 34px}.hero{padding-top:22px}.video-head{padding:12px 13px}.play-icon{width:78px;height:78px;font-size:39px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Video del equipo</h1>
      <p class="sub">Revisa cuidadosamente el estado del dispositivo antes de confirmar tu compra.</p>
      <div class="model" id="modelName"></div>
    </section>

    <section class="grid" id="videoGrid"></section>

    <section class="error" id="errorBox">
      <h2>Enlace no válido</h2>
      <div>Este enlace no contiene un identificador de video válido.</div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const rawV = String(params.get('v') || '').trim();
      const model = String(params.get('m') || '').trim();
      const modelName = document.getElementById('modelName');
      const grid = document.getElementById('videoGrid');
      const errorBox = document.getElementById('errorBox');

      if (model) modelName.textContent = model;

      const ids = rawV
        .split(/[|,;]/)
        .map(v => v.trim())
        .filter(Boolean)
        .filter(id => /^[A-Za-z0-9_-]{10,200}$/.test(id));

      if (!ids.length) {
        errorBox.style.display = 'block';
        return;
      }

      const uniqueIds = [...new Set(ids)].slice(0, 20);

      function requestBigScreen(box) {
        try {
          if (box.requestFullscreen) {
            const p = box.requestFullscreen({ navigationUI: 'hide' });
            if (p && typeof p.catch === 'function') p.catch(() => box.classList.add('fullscreen-fallback'));
            return;
          }
          if (box.webkitRequestFullscreen) {
            box.webkitRequestFullscreen();
            return;
          }
        } catch (e) {}
        box.classList.add('fullscreen-fallback');
      }

      uniqueIds.forEach((id, index) => {
        const previewUrl = `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;

        const card = document.createElement('article');
        card.className = 'video-card';

        const head = document.createElement('div');
        head.className = 'video-head';
        const title = document.createElement('strong');
        title.textContent = uniqueIds.length > 1 ? `Video ${index + 1}` : 'Video del equipo';
        head.appendChild(title);

        const frameWrap = document.createElement('div');
        frameWrap.className = 'frame-wrap';

        const frame = document.createElement('iframe');
        frame.src = 'about:blank';
        frame.title = uniqueIds.length > 1 ? `Video ${index + 1} del equipo` : 'Video del equipo';
        frame.allow = 'autoplay; fullscreen';
        frame.setAttribute('allowfullscreen', '');
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        frameWrap.appendChild(frame);

        const cover = document.createElement('button');
        cover.type = 'button';
        cover.className = 'play-cover';
        cover.setAttribute('aria-label', 'Reproducir video en pantalla completa');
        cover.innerHTML = `
          <div class="play-icon">▶</div>
          <strong>Reproducir en pantalla completa</strong>
          <span>Toca una vez para abrir el video en grande y revisar todos los detalles del equipo.</span>
        `;

        let started = false;
        cover.addEventListener('click', () => {
          if (started) return;
          started = true;

          // El toque del usuario se usa de inmediato para solicitar pantalla completa.
          requestBigScreen(frameWrap);

          // Luego cargamos el reproductor. Drive suele comenzar la reproducción al abrir
          // el visor de video; si el navegador exige interacción adicional, el reproductor
          // ya estará ocupando toda la pantalla.
          frame.src = previewUrl;
          cover.classList.add('hidden');
        });

        frameWrap.appendChild(cover);
        card.append(head, frameWrap);
        grid.appendChild(card);
      });

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          document.querySelectorAll('.fullscreen-fallback').forEach(el => el.classList.remove('fullscreen-fallback'));
        }
      });
      document.addEventListener('webkitfullscreenchange', () => {
        if (!document.webkitFullscreenElement) {
          document.querySelectorAll('.fullscreen-fallback').forEach(el => el.classList.remove('fullscreen-fallback'));
        }
      });
    })();
  </script>
</body>
</html>
