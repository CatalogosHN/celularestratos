<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Video del equipo</title>
  <style>
    :root{
      --bg:#0b111c;
      --card:#111a29;
      --line:#263449;
      --text:#f7f9fc;
      --muted:#b9c7dc;
      --accent:#3b82f6;
      --accent2:#2563eb;
      --danger:#fca5a5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{padding:32px 18px 48px}
    .wrap{width:min(1100px,100%);margin:0 auto}
    .hero{text-align:center;padding:34px 0 18px}
    h1{margin:0 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.08}
    .sub{margin:0;color:var(--muted);font-size:clamp(14px,2vw,17px)}
    .model{margin-top:10px;font-weight:800;color:#dbeafe;word-break:break-word}
    .grid{display:grid;gap:18px;margin-top:16px}
    .video-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card)}
    .video-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
    .video-head strong{font-size:15px}
    .frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    .actions{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border:0;border-radius:12px;text-decoration:none;font-weight:850;cursor:pointer}
    .btn-primary{color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent2))}
    .btn-secondary{color:#dbeafe;background:#18263a;border:1px solid #2b3c55}
    .notice{margin:16px 0 0;padding:13px 15px;border:1px solid #33445d;border-radius:14px;color:#b9c7dc;background:#0f1826;font-size:13px;line-height:1.5}
    .error{display:none;margin-top:16px;padding:20px;border:1px solid #5a2c35;border-radius:16px;background:#24131a;color:var(--danger);text-align:center}
    .error h2{margin:0 0 8px;color:#fff}
    @media(max-width:640px){body{padding:20px 12px 34px}.hero{padding-top:22px}.actions{display:grid}.btn{width:100%}.video-head{padding:12px 13px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Video del equipo</h1>
      <p class="sub">Revisa el estado del dispositivo antes de confirmar tu compra.</p>
      <div class="model" id="modelName"></div>
    </section>

    <section class="grid" id="videoGrid"></section>

    <section class="error" id="errorBox">
      <h2>Enlace no válido</h2>
      <div>Este enlace no contiene un identificador de video válido.</div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const rawV = String(params.get('v') || '').trim();
      const model = String(params.get('m') || '').trim();
      const modelName = document.getElementById('modelName');
      const grid = document.getElementById('videoGrid');
      const errorBox = document.getElementById('errorBox');

      if (model) modelName.textContent = model;

      // IMPORTANTE: no hacemos fetch/HEAD a Drive para "validar" el archivo.
      // Google puede bloquear esas comprobaciones desde GitHub por CORS aunque
      // el archivo sea perfectamente visible. El reproductor de Drive es quien
      // determina si el archivo puede abrirse.
      const ids = rawV
        .split(/[|,;]/)
        .map(v => v.trim())
        .filter(Boolean)
        .filter(id => /^[A-Za-z0-9_-]{10,200}$/.test(id));

      if (!ids.length) {
        errorBox.style.display = 'block';
        return;
      }

      const uniqueIds = [...new Set(ids)].slice(0, 20);

      uniqueIds.forEach((id, index) => {
        const previewUrl = `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
        const viewUrl = `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;

        const card = document.createElement('article');
        card.className = 'video-card';

        const head = document.createElement('div');
        head.className = 'video-head';
        const title = document.createElement('strong');
        title.textContent = uniqueIds.length > 1 ? `Video ${index + 1}` : 'Video del equipo';
        head.appendChild(title);

        const frameWrap = document.createElement('div');
        frameWrap.className = 'frame-wrap';

        const frame = document.createElement('iframe');
        frame.src = previewUrl;
        frame.title = uniqueIds.length > 1 ? `Video ${index + 1} del equipo` : 'Video del equipo';
        frame.allow = 'autoplay; fullscreen';
        frame.setAttribute('allowfullscreen', '');
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        frameWrap.appendChild(frame);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const open = document.createElement('a');
        open.className = 'btn btn-primary';
        open.href = viewUrl;
        open.target = '_blank';
        open.rel = 'noopener noreferrer';
        open.textContent = '▶ Abrir video en Drive';

        const reload = document.createElement('button');
        reload.className = 'btn btn-secondary';
        reload.type = 'button';
        reload.textContent = '↻ Recargar video';
        reload.addEventListener('click', () => {
          frame.src = 'about:blank';
          setTimeout(() => { frame.src = previewUrl; }, 60);
        });

        actions.append(open, reload);
        card.append(head, frameWrap, actions);
        grid.appendChild(card);
      });

      const notice = document.createElement('div');
      notice.className = 'notice';
      notice.textContent = 'El video se reproduce directamente desde Google Drive. Si Drive muestra una solicitud de acceso, el archivo debe configurarse como “Cualquier persona con el enlace”.';
      grid.appendChild(notice);
    })();
  </script>
</body>
</html>
